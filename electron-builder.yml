# Packaging for the desktop app. Run through `npm run desktop:dist`, or by
# .github/workflows/desktop.yml on a release tag.
#
# Everything the app needs is already inside dist/ (Vite bundles React, recharts and
# the rest), so node_modules is deliberately left out of the package.

# Changing appId later makes installed copies look like a different app, so settle it
# before the first public release.
appId: io.github.dniev.ecu-lab
productName: ECU Lab
copyright: Copyright © CaribouTuning and Turtle.GTI

directories:
  output: release
  # Optional: put icon.png (1024x1024) in build/ and every platform's icon is made from it.
  buildResources: build

files:
  - dist/**
  - '!dist/**/*.map'
  - electron/**
  - package.json
  - '!node_modules/**'

asar: true
publish: null

win:
  target:
    - { target: nsis, arch: [x64] }
    - { target: portable, arch: [x64] }
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

mac:
  category: public.app-category.education
  target:
    - { target: dmg, arch: [x64, arm64] }
    - { target: zip, arch: [x64, arm64] }
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  category: Education
  executableName: ecu-lab
  # The .deb needs a maintainer address; this is a placeholder, so put a real one here.
  maintainer: CaribouTuning <noreply@users.noreply.github.com>
  target:
    - { target: AppImage, arch: [x64] }
    - { target: deb, arch: [x64] }
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
